<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渠道商自动评分系统</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #eef3ff 0%, #f8fafc 45%, #eef7f3 100%); color: #111827; }
    .page { max-width: 1080px; margin: 0 auto; padding: 40px 20px; }
    .badge { display: inline-flex; padding: 8px 12px; border-radius: 999px; background: rgba(37,99,235,.08); color: #1d4ed8; font-size: 13px; font-weight: 700; }
    h1 { margin: 16px 0 28px; font-size: 36px; line-height: 1.2; letter-spacing: -.03em; }
    .grid { display: grid; grid-template-columns: minmax(0,420px) minmax(0,1fr); gap: 20px; align-items: start; }
    .card { background: rgba(255,255,255,.9); border: 1px solid rgba(148,163,184,.35); border-radius: 24px; box-shadow: 0 20px 50px rgba(15,23,42,.08); overflow: hidden; }
    .card-header { padding: 22px 22px 0; }
    .card-title { margin: 0; font-size: 18px; font-weight: 800; }
    form { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; color: #374151; }
    input, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 14px; background: #fff; padding: 13px 14px; font-size: 14px; color: #111827; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
    textarea { min-height: 120px; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 4px; }
    button { border: 0; border-radius: 14px; padding: 13px 16px; font-size: 14px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { flex: 1; background: #2563eb; color: #fff; box-shadow: 0 12px 24px rgba(37,99,235,.24); }
    .secondary { background: #eef2ff; color: #1d4ed8; }
    .result-wrap { padding: 22px; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 8px 12px; border-radius: 999px; background: #f3f4f6; color: #4b5563; font-size: 13px; font-weight: 800; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #9ca3af; }
    .status.success { background: #ecfdf5; color: #047857; } .status.success .dot { background: #10b981; }
    .status.error { background: #fef2f2; color: #b91c1c; } .status.error .dot { background: #ef4444; }
    .status.loading { background: #eff6ff; color: #1d4ed8; } .status.loading .dot { background: #2563eb; animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.9)} 50%{opacity:1;transform:scale(1.15)} }
    .result { min-height: 360px; max-height: 620px; border-radius: 18px; background: #0f172a; color: #e5edf9; padding: 22px; overflow: auto; word-break: break-word; font-size: 14px; line-height: 1.8; }
    .result .empty { color: #94a3b8; }
    .result h1, .result h2, .result h3, .result h4 { color: #fff; line-height: 1.35; margin: 1.1em 0 .5em; }
    .result h1 { font-size: 24px; }
    .result h2 { font-size: 20px; border-bottom: 1px solid rgba(148,163,184,.28); padding-bottom: 8px; }
    .result h3 { font-size: 17px; }
    .result p { margin: .65em 0; }
    .result strong { color: #fff; font-weight: 800; }
    .result ul, .result ol { padding-left: 22px; margin: .65em 0; }
    .result li { margin: .28em 0; }
    .result a { color: #93c5fd; text-decoration: underline; }
    .result blockquote { margin: 14px 0; padding: 10px 14px; border-left: 4px solid #60a5fa; background: rgba(59,130,246,.12); color: #dbeafe; border-radius: 10px; }
    .result code { background: rgba(148,163,184,.18); color: #bfdbfe; padding: 2px 6px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .92em; }
    .result pre { background: #020617; color: #dbeafe; padding: 14px; border-radius: 12px; overflow: auto; line-height: 1.7; }
    .result pre code { background: transparent; padding: 0; color: inherit; }
    .result table { width: 100%; border-collapse: collapse; margin: 14px 0; display: block; overflow-x: auto; }
    .result th, .result td { border: 1px solid rgba(148,163,184,.35); padding: 10px 12px; text-align: left; vertical-align: top; }
    .result th { background: rgba(148,163,184,.18); color: #fff; }
    .feedback-box { margin-top: 14px; padding: 16px; border-radius: 16px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 13px; line-height: 1.7; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .feedback-text { margin: 0; color: #1e40af; }
    .feedback-link { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 10px 14px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 800; white-space: nowrap; box-shadow: 0 10px 22px rgba(37,99,235,.22); }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <main class="page">
    <section>
      <div class="badge">公开网页版本</div>
      <h1>渠道商自动评分系统</h1>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-header"><h2 class="card-title">输入信息</h2></div>
        <form id="scoreForm">
          <div><label for="companyName">公司名称 company_name</label><input id="companyName" type="text" placeholder="例如：CUHK" required /></div>
          <div><label for="countryOrRegion">国家或地区 country_or_region</label><input id="countryOrRegion" type="text" placeholder="例如：Hong Kong" required /></div>
          <div><label for="extraNotes">补充说明 extra_notes</label><textarea id="extraNotes" placeholder="例如：主营品类、合作背景、网站链接、已有沟通记录等，可留空"></textarea></div>
          <div class="actions"><button class="secondary" type="button" id="clearBtn">清空</button><button class="primary" type="submit" id="submitBtn">运行评分</button></div>
        </form>
      </div>

      <div class="card">
        <div class="card-header"><h2 class="card-title">评分结果</h2></div>
        <div class="result-wrap">
          <div id="status" class="status"><span class="dot"></span>等待运行</div>
          <div id="result" class="result"><span class="empty">运行后结果会显示在这里。</span></div>
          <div class="feedback-box">
            <p class="feedback-text">使用过程中遇到问题，或对评分结果有建议？欢迎提交反馈问卷。</p>
            <a class="feedback-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdBwtRB0ZR17r4Qg2TqDRHatwILutpWtygJGjhRhRhiE3PFrA/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer">填写反馈问卷</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_ENDPOINT = "/api/score";

    const form = document.getElementById("scoreForm");
    const companyNameInput = document.getElementById("companyName");
    const countryOrRegionInput = document.getElementById("countryOrRegion");
    const extraNotesInput = document.getElementById("extraNotes");
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    if (window.marked) {
      marked.setOptions({ breaks: true, gfm: true });
    }

    function setStatus(type, text) {
      statusEl.className = `status ${type || ""}`.trim();
      statusEl.innerHTML = `<span class="dot"></span>${text}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderMarkdown(markdownText) {
      if (!window.marked || !window.DOMPurify) {
        resultEl.textContent = markdownText || "";
        return;
      }

      const rawHtml = marked.parse(markdownText || "");
      const safeHtml = DOMPurify.sanitize(rawHtml);
      resultEl.innerHTML = safeHtml;

      resultEl.querySelectorAll("a").forEach((a) => {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      });
    }

    function showResult(content, options = {}) {
      if (options.loading || options.error) {
        resultEl.textContent = typeof content === "string" ? content : JSON.stringify(content, null, 2);
        return;
      }

      if (typeof content === "string") {
        renderMarkdown(content);
        return;
      }

      const possibleMarkdown =
        content?.result ||
        content?.answer ||
        content?.text ||
        content?.output ||
        content?.content;

      if (typeof possibleMarkdown === "string") {
        renderMarkdown(possibleMarkdown);
      } else {
        resultEl.innerHTML = `<pre><code>${escapeHtml(JSON.stringify(content, null, 2))}</code></pre>`;
      }
    }

    async function runScore(payload) {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }

      if (!response.ok) {
        throw new Error(typeof data === "string" ? data : JSON.stringify(data, null, 2));
      }
      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const companyName = companyNameInput.value.trim();
      const countryOrRegion = countryOrRegionInput.value.trim();
      const extraNotes = extraNotesInput.value.trim();

      if (!companyName || !countryOrRegion) {
        setStatus("error", "请先填写必填项");
        return;
      }

      submitBtn.disabled = true;
      setStatus("loading", "正在运行评分...");
      showResult("请求中，请稍候...", { loading: true });

      try {
        const data = await runScore({ company_name: companyName, country_or_region: countryOrRegion, extra_notes: extraNotes });
        const outputs = data?.data?.outputs;
        const finalResult = data?.data?.result || outputs?.result || outputs || data;
        setStatus("success", "运行成功");
        showResult(finalResult);
      } catch (error) {
        setStatus("error", "运行失败");
        showResult(error.message || String(error), { error: true });
      } finally {
        submitBtn.disabled = false;
      }
    });

    clearBtn.addEventListener("click", () => {
      companyNameInput.value = "";
      countryOrRegionInput.value = "";
      extraNotesInput.value = "";
      setStatus("", "等待运行");
      resultEl.innerHTML = '<span class="empty">运行后结果会显示在这里。</span>';
    });
  </script>
</body>
</html>
